<svg xmlns="http://www.w3.org/2000/svg" width="420" height="110" viewBox="0 0 420 110" role="img" aria-labelledby="title">
  <title id="title">SSLock - Smart Lock Security</title>

  <!-- Monochrome Minimalist Lock Graphic (No Border, Transparent) -->
  <g transform="translate(10, 15)">
    <!-- Shackle -->
    <path d="M 22 36 V 22 C 22 11.5 30.5 3 41 3 C 51.5 3 60 11.5 60 22 V 36" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="5.5" 
          stroke-linecap="round"/>
    <!-- Lock Solid Body -->
    <rect x="10" y="34" width="62" height="46" rx="6" fill="#ffffff"/>
    <!-- Keyhole -->
    <circle cx="41" cy="53" r="5" fill="#111111"/>
    <polygon points="38.5,55 36.5,70 45.5,70 43.5,55" fill="#111111"/>
  </g>

  <!-- Typography: Standard clean sans font, stark black & white contrast -->
  <!-- SS -->
  <text x="96" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="900" letter-spacing="-1" fill="#ffffff">SS</text>
  <!-- LOCK -->
  <text x="168" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="300" letter-spacing="1" fill="#ffffff">LOCK</text>
  
  <!-- Sleek Tagline -->
  <text x="98" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="4" fill="#a3a3a3">SMART SECURITY</text>
</svg>
