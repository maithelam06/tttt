<svg xmlns="http://www.w3.org/2000/svg" width="200" height="48" viewBox="0 0 200 48" role="img" aria-labelledby="adminLogoTitle">
  <title id="adminLogoTitle">SSLock Admin</title>

  <!-- Monochrome Minimalist Lock Graphic -->
