    <path d="M 11 16 V 9 C 11 4.5 15 1.5 19.5 1.5 C 24 1.5 28 4.5 28 9 V 16" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="2.6" 
          stroke-linecap="round"/>
    <rect x="5" y="15" width="29" height="20" rx="3.5" fill="#ffffff"/>
    <circle cx="19.5" cy="23" r="2.5" fill="#111111"/>
