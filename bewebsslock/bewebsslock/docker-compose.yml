services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: sslock
      MYSQL_USER: sslock
      MYSQL_PASSWORD: sslock123
      MYSQL_ROOT_PASSWORD: root123
    ports:
      - "3307:3306"
    volumes:
      - sslock_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -proot123 --silent"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      DB_URL: jdbc:mysql://mysql:3306/sslock?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Bangkok&characterEncoding=UTF-8
      DB_USERNAME: sslock
      DB_PASSWORD: sslock123
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  sslock_mysql_data:
